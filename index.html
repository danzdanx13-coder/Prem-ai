<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>damz ai</title>
<meta name="theme-color" content="#0b0d14">
<style>
:root{--bg:#0b0d14;--panel:#131625;--panel2:#1a1e33;--line:#262b45;--text:#eef0ff;--muted:#8b92b8;--accent:#7c8cff;--accent2:#c084fc;--danger:#ff6b8a;--gold:#f5c76b;--sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box}
body{margin:0;height:100vh;height:100dvh;background:var(--bg);color:var(--text);font:400 15px/1.55 var(--sans);display:flex;-webkit-font-smoothing:antialiased;overflow:hidden}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,select{font:inherit;color:inherit;cursor:pointer}
button{border:0;background:none}
button:disabled{opacity:.45;cursor:not-allowed}
.hidden{display:none!important}

/* Sidebar riwayat */
aside{width:260px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px}
.newbtn{width:100%;padding:11px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:600}
.list{flex:1;overflow-y:auto;margin:12px -4px;display:flex;flex-direction:column;gap:4px}
.item{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:10px;cursor:pointer}
.item:hover{background:var(--panel2)}
.item.on{background:var(--panel2);border:1px solid var(--line)}
.item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.item .del{color:var(--muted);font-size:14px;padding:2px 6px;border-radius:6px}
.item .del:hover{color:var(--danger)}
.empty-list{color:var(--muted);font-size:13px;padding:8px 10px}
.acct{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Area utama */
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:800;font-size:18px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.dot{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.menu{display:none;width:36px;height:36px;border-radius:10px;border:1px solid var(--line)}
.right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
select option:disabled{color:var(--muted)}
.pill{font-size:13px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
.pill.paid{border-color:var(--gold);color:var(--gold)}
.usage{font-size:12px;color:var(--muted);padding:6px 16px;border-bottom:1px solid var(--line)}
.usage.warn{color:var(--danger)}

main{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:min(680px,88%);padding:11px 15px;border-radius:18px;animation:in .3s ease-out both;word-wrap:break-word;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.err{align-self:flex-start;border:1px solid var(--danger);color:#ffb3c2}
.msg img{display:block;max-width:240px;max-height:240px;border-radius:12px;margin-bottom:6px}
.typing{align-self:flex-start;color:var(--muted);font-size:13px;padding:4px 6px}
.hero{margin:auto;text-align:center;color:var(--muted);max-width:360px}
.hero h2{color:var(--text);font-size:24px;margin:0 0 8px;letter-spacing:-.02em}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.composer{border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel)}
.preview{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;color:var(--muted)}
.preview img{width:44px;height:44px;object-fit:cover;border-radius:8px}
.preview button{color:var(--muted);padding:4px 8px}
.bar{display:flex;align-items:flex-end;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:7px}
textarea{flex:1;resize:none;max-height:140px;background:transparent;border:0;color:var(--text);font:inherit;padding:8px 6px;outline:none}
.icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);flex:none}
.icon.rec{background:var(--danger);border-color:var(--danger);color:#fff;animation:pulse 1.2s ease-in-out infinite}
.icon.send{background:var(--accent);border-color:var(--accent);color:#fff}
@keyframes pulse{50%{box-shadow:0 0 0 7px transparent}}
.note{font-size:12px;color:var(--muted);margin:8px 4px 0;min-height:1em}

.overlay{position:fixed;inset:0;background:rgb(0 0 0 / .6);display:grid;place-items:center;padding:20px;z-index:10}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;max-width:460px;width:100%;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 4px;font-size:20px}
.modal > p{color:var(--muted);margin:0 0 16px}
.tiers{display:grid;gap:10px}
.tier{border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;background:var(--panel2);width:100%}
.tier.sel{border-color:var(--gold)}
.tier b{display:block;font-size:16px}
.tier small{color:var(--muted)}
.tier .pr{float:right;font-weight:700;color:var(--gold)}
.tier ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:13px}
.btn{width:100%;padding:12px;border-radius:14px;background:linear-gradient(135deg,var(--gold),#e8a94a);color:#1a1405;font-weight:700;margin-top:14px}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);font-weight:500;margin-top:8px}

@media (max-width:760px){
  aside{position:absolute;inset:0 auto 0 0;z-index:5;transform:translateX(-100%);transition:transform .25s}
  aside.open{transform:none;box-shadow:8px 0 30px rgb(0 0 0 / .5)}
  .menu{display:grid;place-items:center}
}
</style>
</head>
<body>

<aside id="side">
  <button class="newbtn" id="newBtn" type="button">+ Chat baru</button>
  <div class="list" id="list"></div>
  <div class="acct" id="acct"></div>
</aside>

<div class="main">
  <header>
    <div class="brand">
      <button class="menu" id="menuBtn" type="button" aria-label="Riwayat">☰</button>
      <span class="dot"></span>damz ai
    </div>
    <div class="right">
      <select id="mode" aria-label="Pilih mode">
        <option value="cepat">Balas Cepat</option>
        <option value="belajar">Mode Belajar</option>
        <option value="cerdas">Mode Cerdas ✦</option>
      </select>
      <button class="pill" id="planBtn" type="button">Paket</button>
      <button class="pill" id="authBtn" type="button">Masuk</button>
    </div>
  </header>
  <div class="usage hidden" id="usage"></div>

  <main id="chat">
    <div class="hero" id="hero">
      <h2>Halo, saya damz ai</h2>
      <p id="heroTxt">Ketik pesan, kirim foto, atau pakai voice note.</p>
    </div>
  </main>

  <div class="composer">
    <div class="preview hidden" id="preview">
      <img id="previewImg" alt="Pratinjau foto">
      <span>Foto siap dikirim</span>
      <button type="button" id="removeImg" aria-label="Hapus foto">✕</button>
    </div>
    <div class="bar">
      <button class="icon" id="photoBtn" type="button" aria-label="Kirim foto">🖼️</button>
      <input id="file" type="file" accept="image/*" class="hidden">
      <button class="icon" id="recBtn" type="button" aria-label="Voice note">🎙️</button>
      <textarea id="input" rows="1" placeholder="Tulis pesan…"></textarea>
      <button class="icon send" id="sendBtn" type="button" aria-label="Kirim">➤</button>
    </div>
    <p class="note" id="note"></p>
  </div>
</div>

<!-- Gerbang masuk -->
<div class="overlay hidden" id="gate">
  <div class="modal">
    <h3>Masuk ke damz ai</h3>
    <p>Riwayat chat dan paket Anda tersimpan di akun. Masuk atau daftar untuk mulai.</p>
    <button class="btn" id="gateBtn" type="button">Masuk / Daftar</button>
  </div>
</div>

<!-- Pilih paket -->
<div class="overlay hidden" id="overlay">
  <div class="modal">
    <h3>Pilih paket</h3>
    <p>Mode Cerdas tersedia di Premium dan Max.</p>
    <div class="tiers" id="tiers"></div>
    <button class="btn" id="buyBtn" type="button">Lanjut ke pembayaran</button>
    <button class="btn ghost" id="closeBtn" type="button">Tutup</button>
  </div>
</div>

<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const chat = $("chat"), input = $("input"), modeSel = $("mode"), note = $("note");
const st = { me: null, convId: null, image: null, busy: false, rec: null, chunks: [], recTimer: null };
const MODE_NAME = { cepat: "Balas Cepat", belajar: "Mode Belajar", cerdas: "Mode Cerdas" };
const fmtRp = (n) => n ? "Rp" + n.toLocaleString("id-ID") : "Rp0";

function setNote(t){ note.textContent = t || ""; }

// Panggilan ke server dengan token login
async function api(path, opts = {}){
  const headers = { "Content-Type": "application/json" };
  const u = netlifyIdentity.currentUser();
  if (u) headers.Authorization = "Bearer " + await u.jwt();
  const res = await fetch("/.netlify/functions/" + path, { ...opts, headers: { ...headers, ...(opts.headers || {}) } });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(data.error || "Terjadi kesalahan."); e.code = data.code; throw e; }
  return data;
}

function bubble(role, text, hasImage){
  $("hero").classList.add("hidden");
  const d = document.createElement("div");
  d.className = "msg " + role;
  if (hasImage) { const t = document.createElement("div"); t.textContent = "🖼️ Foto terkirim"; t.style.cssText = "font-size:12px;opacity:.8;margin-bottom:4px"; d.appendChild(t); }
  const b = document.createElement("div");
  b.textContent = text;
  d.appendChild(b);
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping(on){
  let el = $("typing");
  if (on && !el) {
    el = document.createElement("div");
    el.id = "typing"; el.className = "typing"; el.textContent = "damz ai sedang menulis…";
    chat.appendChild(el); chat.scrollTop = chat.scrollHeight;
  } else if (!on && el) el.remove();
}

function resetChat(){
  chat.innerHTML = "";
  const h = document.createElement("div");
  h.className = "hero"; h.id = "hero";
  h.innerHTML = "<h2>Halo, saya damz ai</h2><p>Ketik pesan, kirim foto, atau pakai voice note.</p>";
  chat.appendChild(h);
}

// Status akun
function renderMe(){
  const m = st.me;
  if (!m) return;
  const paid = m.plan !== "gratis";
  $("planBtn").textContent = m.planName + (paid ? " ✦" : "");
  $("planBtn").classList.toggle("paid", paid);
  $("authBtn").textContent = "Keluar";
  $("acct").textContent = m.email || "";
  const u = $("usage");
  u.classList.remove("hidden");
  u.classList.toggle("warn", m.used >= m.limit);
  u.textContent = `Pemakaian hari ini: ${m.used} dari ${m.limit} pesan · Paket ${m.planName}` +
    (m.planExpires ? ` (berlaku sampai ${new Date(m.planExpires).toLocaleDateString("id-ID")})` : "");
  [...modeSel.options].forEach((o) => o.disabled = !m.modes.includes(o.value));
  if (!m.modes.includes(modeSel.value)) modeSel.value = "cepat";
}

async function loadMe(){
  st.me = await api("me");
  renderMe();
}

async function loadList(){
  const { conversations } = await api("conversations");
  const list = $("list");
  list.innerHTML = "";
  if (!conversations.length) {
    const e = document.createElement("div"); e.className = "empty-list"; e.textContent = "Belum ada riwayat chat.";
    list.appendChild(e); return;
  }
  conversations.forEach((c) => {
    const row = document.createElement("div");
    row.className = "item" + (c.id === st.convId ? " on" : "");
    const t = document.createElement("span"); t.textContent = c.title || "Percakapan";
    const d = document.createElement("button"); d.className = "del"; d.type = "button"; d.textContent = "✕"; d.setAttribute("aria-label", "Hapus riwayat");
    row.append(t, d);
    row.addEventListener("click", (e) => { if (e.target === d) return; openConv(c.id); });
    d.addEventListener("click", async (e) => {
      e.stopPropagation();
      if (!confirm("Hapus percakapan ini?")) return;
      await api("conversations?id=" + encodeURIComponent(c.id), { method: "DELETE" });
      if (st.convId === c.id) { st.convId = null; resetChat(); }
      loadList();
    });
    list.appendChild(row);
  });
}

async function openConv(id){
  const c = await api("conversations?id=" + encodeURIComponent(id));
  st.convId = id;
  resetChat();
  $("hero").classList.add("hidden");
  c.messages.forEach((m) => bubble(m.role === "user" ? "user" : "ai", m.text, m.hasImage));
  $("side").classList.remove("open");
  loadList();
}

// Foto: diperkecil di browser agar hemat
function readImage(file){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = reject;
    const r = new FileReader();
    r.onload = () => img.src = r.result;
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

$("photoBtn").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", async (e) => {
  const f = e.target.files[0];
  e.target.value = "";
  if (!f) return;
  if (f.size > 8 * 1024 * 1024) { setNote("Foto terlalu besar. Maksimal 8 MB."); return; }
  try {
    st.image = await readImage(f);
    $("previewImg").src = st.image;
    $("preview").classList.remove("hidden");
    setNote("");
  } catch { setNote("Foto tidak bisa dibaca."); }
});
$("removeImg").addEventListener("click", () => { st.image = null; $("preview").classList.add("hidden"); });

function blobToBase64(blob){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(",")[1]);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

// Voice note: rekam di browser, lalu ditranskripsi di server
$("recBtn").addEventListener("click", async () => {
  if (st.rec) { st.rec.stop(); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder) { setNote("Browser ini belum mendukung rekaman suara."); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const rec = new MediaRecorder(stream);
    st.chunks = [];
    rec.ondataavailable = (e) => { if (e.data.size) st.chunks.push(e.data); };
    rec.onstop = async () => {
      clearTimeout(st.recTimer);
      stream.getTracks().forEach((t) => t.stop());
      $("recBtn").classList.remove("rec");
      st.rec = null;
      const blob = new Blob(st.chunks, { type: rec.mimeType || "audio/webm" });
      if (blob.size < 1000) { setNote("Rekaman terlalu pendek."); return; }
      setNote("Mengubah suara menjadi teks…");
      try {
        const data = await api("transcribe", { method: "POST", body: JSON.stringify({ audio: await blobToBase64(blob), mime: blob.type }) });
        input.value = (input.value ? input.value + " " : "") + data.text;
        input.dispatchEvent(new Event("input"));
        setNote(data.text ? "Voice note sudah jadi teks. Tekan kirim." : "Suara tidak terdengar jelas.");
      } catch (err) {
        setNote(err.message);
        if (err.code === "QUOTA") openPlans();
      }
    };
    rec.start();
    st.rec = rec;
    $("recBtn").classList.add("rec");
    setNote("Merekam… tekan lagi untuk berhenti (maks. 2 menit).");
    st.recTimer = setTimeout(() => { if (st.rec) st.rec.stop(); }, 120000);
  } catch {
    setNote("Izin mikrofon ditolak.");
  }
});

async function send(){
  if (st.busy || !st.me) return;
  const text = input.value.trim();
  if (!text && !st.image) return;
  const mode = modeSel.value;
  if (!st.me.modes.includes(mode)) { openPlans(); return; }

  const image = st.image;
  bubble("user", text || "Tolong jelaskan foto ini.", !!image);
  input.value = ""; input.style.height = "auto";
  st.image = null; $("preview").classList.add("hidden");

  st.busy = true; $("sendBtn").disabled = true; showTyping(true); setNote("");
  try {
    const data = await api("chat", {
      method: "POST",
      body: JSON.stringify({ conversationId: st.convId, mode, text, image }),
    });
    st.convId = data.conversationId;
    showTyping(false);
    bubble("ai", data.text);
    await loadMe();
    loadList();
  } catch (err) {
    showTyping(false);
    const d = document.createElement("div");
    d.className = "msg err"; d.textContent = err.message;
    chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
    if (err.code === "PLAN") openPlans();
    if (err.code === "AUTH") netlifyIdentity.open();
    loadMe().catch(() => {});
  } finally {
    st.busy = false; $("sendBtn").disabled = false;
  }
}
$("sendBtn").addEventListener("click", send);
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px"; });
modeSel.addEventListener("change", () => { if (st.me && !st.me.modes.includes(modeSel.value)) openPlans(); });

$("newBtn").addEventListener("click", () => { st.convId = null; resetChat(); loadList(); $("side").classList.remove("open"); });
$("menuBtn").addEventListener("click", () => $("side").classList.toggle("open"));

// Paket dan pembayaran
let selectedPlan = null;
function openPlans(){
  if (!st.me) return;
  const wrap = $("tiers");
  wrap.innerHTML = "";
  selectedPlan = st.me.plan === "gratis" ? "pro" : st.me.plan;
  Object.entries(st.me.plans).forEach(([key, p]) => {
    if (key === "gratis") return;
    const b = document.createElement("button");
    b.type = "button";
    b.className = "tier" + (key === selectedPlan ? " sel" : "");
    b.innerHTML = `<span class="pr">${fmtRp(p.price)}</span><b>${p.name}</b><small>per ${st.me.planDays} hari · ${p.daily} pesan/hari</small><ul><li>Mode: ${p.modes.map((m) => MODE_NAME[m]).join(", ")}</li></ul>`;
    b.addEventListener("click", () => {
      selectedPlan = key;
      [...wrap.children].forEach((c) => c.classList.toggle("sel", c === b));
    });
    wrap.appendChild(b);
  });
  $("overlay").classList.remove("hidden");
}
function closePlans(){ $("overlay").classList.add("hidden"); }
$("planBtn").addEventListener("click", openPlans);
$("closeBtn").addEventListener("click", closePlans);
$("overlay").addEventListener("click", (e) => { if (e.target.id === "overlay") closePlans(); });
$("buyBtn").addEventListener("click", async () => {
  try {
    const data = await api("checkout", { method: "POST", body: JSON.stringify({ plan: selectedPlan }) });
    location.href = data.redirect_url;
  } catch (err) {
    setNote(err.message);
    closePlans();
  }
});

// Login dengan Netlify Identity
const gate = $("gate");
function showGate(on){ gate.classList.toggle("hidden", !on); }
$("gateBtn").addEventListener("click", () => netlifyIdentity.open());
$("authBtn").addEventListener("click", () => {
  if (netlifyIdentity.currentUser()) netlifyIdentity.logout(); else netlifyIdentity.open();
});

async function boot(){
  showGate(false);
  try {
    await loadMe();
    await loadList();
    if (new URLSearchParams(location.search).has("paid")) {
      setNote("Terima kasih. Paket Anda akan aktif setelah pembayaran terkonfirmasi.");
      history.replaceState(null, "", "/");
      setTimeout(() => loadMe().catch(() => {}), 3000);
    }
  } catch (err) {
    setNote(err.message);
  }
}

netlifyIdentity.on("init", (user) => { if (user) boot(); else showGate(true); });
netlifyIdentity.on("login", () => { netlifyIdentity.close(); boot(); });
netlifyIdentity.on("logout", () => location.reload());
netlifyIdentity.init();
</script>
</body>
</html>
